<title>Porovnání cen potravin</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f3f3f1; --card: #fff; --text: #1a1a1a; --muted: #888; --border: #e6e6e6;

  --red: #c62828; --red-bg: #fff5f5;
  --amber: #e65100; --amber-bg: #fff8e1;
  --blue: #1565c0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); }

header {
  background: #111; color: #fff;
  padding: 26px 32px 20px;
  display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 12px;
}
header h1 { font-family: 'Syne', sans-serif; font-size: clamp(1.4rem,4vw,2rem); font-weight: 800; letter-spacing: -0.03em; }
.header-sub { font-size: 0.72rem; color: #777; margin-top: 4px; }

.summary-bar {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(130px,1fr));
  gap: 1px; background: var(--border);
}
.stat { background: #fff; padding: 12px 18px; }
.stat .val { font-family: 'Syne', sans-serif; font-size: 1.5rem; font-weight: 800; }
.stat .lbl { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-top: 1px; }
.val.g { color: var(--green); } .val.r { color: var(--red); } .val.a { color: var(--amber); }

.toolbar {
  padding: 12px 32px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  background: #fff; border-bottom: 1px solid var(--border);
}
.filter-btn {
  padding: 5px 13px; border-radius: 20px; border: 1.5px solid var(--border);
  background: transparent; font-family: 'DM Sans', sans-serif; font-size: 0.78rem;
  font-weight: 500; cursor: pointer; transition: all 0.15s; color: var(--text);
}
.filter-btn:hover { border-color: #aaa; }
.filter-btn.active { background: var(--text); border-color: var(--text); color: #fff; }
.search-box {
  margin-left: auto; padding: 5px 12px; border-radius: 20px;
  border: 1.5px solid var(--border); font-family: 'DM Sans', sans-serif;
  font-size: 0.78rem; outline: none; width: 160px;
}
.search-box:focus { border-color: #aaa; }

main { padding: 18px 32px; max-width: 1400px; margin: 0 auto; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px,1fr)); gap: 12px; }

.card {
  background: var(--card); border-radius: 12px; border: 1.5px solid var(--border);
  overflow: hidden; transition: box-shadow 0.2s, transform 0.15s;
  animation: fadeIn 0.25s ease both;
}
.card:hover { box-shadow: 0 6px 20px rgba(0,0,0,0.07); transform: translateY(-2px); }
@keyframes fadeIn { from { opacity:0; transform: translateY(5px); } to { opacity:1; transform:none; } }

.card-head {
  padding: 11px 14px 9px; border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
}
.card-title { font-weight: 600; font-size: 0.88rem; line-height: 1.3; flex: 1; }
.freq { background: #f0f0f0; color: var(--muted); font-size: 0.65rem; padding: 2px 7px; border-radius: 10px; font-weight: 500; white-space: nowrap; }

.stores-list { padding: 6px 0; }
.store-row {
  display: grid; grid-template-columns: 110px 1fr auto;
  align-items: center; gap: 6px;
  padding: 5px 14px; border-bottom: 1px solid #f5f5f5;
  transition: background 0.1s;
}
.store-row:last-child { border-bottom: none; }
.store-row:hover { background: #fafafa; }
.store-row.is-winner { background: var(--green-bg); }
.store-row.is-winner:hover { background: #dcedc8; }
.store-row.has-deal { background: var(--amber-bg); }
.store-row.has-deal:hover { background: #fff0c2; }
.store-row.is-winner.has-deal { background: linear-gradient(90deg, var(--green-bg), var(--amber-bg)); }

.store-name {
  font-size: 0.75rem; font-weight: 600; color: var(--muted);
  display: flex; align-items: center; gap: 4px;
}
.store-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

.product-name { font-size: 0.7rem; color: #999; line-height: 1.3; }

.price-cell { text-align: right; white-space: nowrap; }
.price-val { font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 700; }
.price-amount { font-size: 0.65rem; color: var(--muted); display: block; }

.badges { display: flex; gap: 3px; justify-content: flex-end; margin-top: 2px; }
.badge {
  font-size: 0.58rem; font-weight: 700; padding: 1px 5px; border-radius: 3px; white-space: nowrap;
}
.badge-winner { background: var(--green); color: #fff; }
.badge-deal { background: var(--amber); color: #fff; }

.card-footer {
  padding: 7px 14px; border-top: 1px solid var(--border);
  font-size: 0.7rem; color: var(--muted);
  display: flex; align-items: center; justify-content: space-between;
}
.saving { font-weight: 600; color: var(--green); }

.empty { padding: 48px 32px; text-align: center; color: var(--muted); font-size: 0.9rem; }

/* Store color dots */
.dot-rohlik { background: #43a047; }
.dot-kosik { background: #1e88e5; }

@media (max-width: 600px) {

  .summary-bar { grid-template-columns: 1fr 1fr; }
  .grid { grid-template-columns: 1fr; }
  .store-row { grid-template-columns: 90px 1fr auto; }

</style>

// --- Render ---
function getWinner(stores) {
  return stores.reduce((a, b) => a.price <= b.price ? a : b);
}

function buildSummary() {
  let deals = 0, totalSaving = 0, storeSet = new Set();
  products.forEach(p => {
    p.stores.forEach(s => { storeSet.add(s.store); if (s.deal) deals++; });
    if (p.stores.length > 1) {
      const prices = p.stores.map(s => s.price);
      totalSaving += Math.max(...prices) - Math.min(...prices);
    }
  });
  document.getElementById('summaryBar').innerHTML = [
    {val: products.length, lbl: 'Produktů', cls:''},
    {val: storeSet.size,   lbl: 'Obchodů', cls:'g'},
    {val: deals,           lbl: 'V akci / letáku', cls:'a'},
    {val: Math.round(totalSaving) + ' Kč', lbl: 'Max. úspora', cls:'g'},
  ].map(s => `<div class="stat"><div class="val ${s.cls}">${s.val}</div><div class="lbl">${s.lbl}</div></div>`).join('');
}

function buildCards(filter, search) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  let count = 0;

  const filtered = products.filter(p => {
    if (search && !p.name.toLowerCase().includes(search.toLowerCase())) return false;
    if (filter === 'deal') return p.stores.some(s => s.deal || s.origPrice);
    if (filter === 'spread') {
      const prices = p.stores.map(s => s.price);
      return (Math.max(...prices) - Math.min(...prices)) > 10;
    }
    return true;
  });

  // Sort spread by biggest difference
  if (filter === 'spread') {
    filtered.sort((a, b) => {
      const spreadA = Math.max(...a.stores.map(s=>s.price)) - Math.min(...a.stores.map(s=>s.price));
      const spreadB = Math.max(...b.stores.map(s=>s.price)) - Math.min(...b.stores.map(s=>s.price));
      return spreadB - spreadA;
    });
  }

  if (!filtered.length) {
    grid.innerHTML = '<div class="empty">Žádné produkty nevyhovují filtru.</div>';
    return;
  }

  filtered.forEach((p, i) => {
    const winner = getWinner(p.stores);
    const prices = p.stores.map(s => s.price);
    const maxPrice = Math.max(...prices);
    const saving = maxPrice - winner.price;
    const storesSorted = [...p.stores].sort((a, b) => a.price - b.price);

    const card = document.createElement('div');
    card.className = 'card';
    card.style.animationDelay = (count * 0.03) + 's';

    const rowsHtml = storesSorted.map(s => {
      const isWinner = s.price === winner.price;
      const hasDeal = !!(s.deal || s.origPrice);
      const cls = `store-row${isWinner ? ' is-winner' : ''}${hasDeal ? ' has-deal' : ''}`;
      const badges = [
        isWinner ? '<span class="badge badge-winner">Nejlevnější</span>' : '',
        s.deal ? `<span class="badge badge-deal">Leták ${s.validUntil}</span>` : '',
        s.origPrice ? `<span class="badge badge-deal">Sleva</span>` : '',
      ].join('');
      return `
        <div class="${cls}">
          <div class="store-name">
            <div class="store-dot ${storeDot(s.store)}"></div>
            ${storeLabel(s.store)}
          </div>
          <div class="product-name">${s.name}${s.origPrice ? ` <span style="text-decoration:line-through;color:#bbb">${fmt(s.origPrice)}</span>` : ''}</div>
          <div class="price-cell">
            <span class="price-val">${fmt(s.price)}</span>
            <div class="badges">${badges}</div>
          </div>
        </div>`;
    }).join('');

    const footerHtml = saving > 0.5
      ? `<div class="card-footer"><span>Úspora oproti nejdražšímu</span><span class="saving">${fmt(saving)}</span></div>`
      : '';

    card.innerHTML = `
      <div class="card-head">
        <div class="card-title">${p.name}</div>
        <div class="freq">${p.freq}</div>
      </div>
      <div class="stores-list">${rowsHtml}</div>
      ${footerHtml}
    `;
    grid.appendChild(card);
    count++;
  });

  // Update filter counts
  document.querySelectorAll('.filter-btn').forEach(btn => {
    if (btn.dataset.filter === filter) {
      btn.textContent = btn.textContent.replace(/\s*\(\d+\)/, '') + ` (${count})`;
    }
  });
}

// Events
let currentFilter = 'all';
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => { b.classList.remove('active'); b.textContent = b.textContent.replace(/\s*\(\d+\)/, ''); });
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    buildCards(currentFilter, document.getElementById('searchBox').value);
  });
});
document.getElementById('searchBox').addEventListener('input', e => {
  buildCards(currentFilter, e.target.value);
});

buildSummary();
buildCards('all', '');
</script>
</body>
</html>
